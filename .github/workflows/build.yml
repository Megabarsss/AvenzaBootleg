name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Terima lisensi Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          mkdir -p "$SDK/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" > "$SDK/licenses/android-sdk-license"
          echo "sdk.dir=$SDK" > local.properties
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        shell: bash
        run: |
          set +e
          gradle assembleDebug --no-daemon 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" != "0" ]; then
            msg=$(grep -E '^e: |error:|What went wrong|Execution failed|AAPT|Resource' -A2 build.log | head -60 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Gagal build::${msg}"
          fi
          exit $code
      - name: Beri nama APK dengan versi
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "VER=$VER" >> "$GITHUB_ENV"
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/PdfMaps-v${VER}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: PdfMaps-v${{ env.VER }}
          path: out/*.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=$(awk -v v="v${VER}" '$0 ~ "^## "v" " {f=1; next} /^## /{f=0} f' CHANGELOG.md)
          gh release delete "v${VER}" --yes --cleanup-tag || true
          gh release create "v${VER}" "out/PdfMaps-v${VER}.apk" \
            --target "$GITHUB_SHA" --title "PdfMaps v${VER}" \
            --notes "${NOTES:-Debug APK dari commit $GITHUB_SHA}"
          gh release delete latest --yes --cleanup-tag || true
          cp "out/PdfMaps-v${VER}.apk" out/PdfMaps.apk
          gh release create latest "out/PdfMaps-v${VER}.apk" out/PdfMaps.apk \
            --target "$GITHUB_SHA" --title "PdfMaps terbaru (v${VER})" \
            --notes "Versi terbaru: v${VER}. Riwayat: CHANGELOG.md"
